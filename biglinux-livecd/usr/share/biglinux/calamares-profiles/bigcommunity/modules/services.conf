---
units:
    - name: bluetooth
      action: enable
      mandatory: false
    - name: cronie
      action: enable
      mandatory: false
    - name: ModemManager
      action: enable
      mandatory: false
    - name: NetworkManager
      action: enable
      mandatory: false
    - name: cups
      action: enable
      mandatory: false
    - name: fstrim.timer
      action: enable
      mandatory: false
    - name: pkgfile-update.timer
      action: enable
      mandatory: false
    - name: vboxservice
      action: enable
      mandatory: false
    - name: ufw
      action: enable
      mandatory: false
    - name: nmb
      action: enable
      mandatory: false
    - name: smb
      action: enable
      mandatory: false
    - name: dnsmasq
      action: enable
      mandatory: false
    - name: cups-browsed
      action: enable
      mandatory: false
    # One of these three is what the edition installed: sddm on KDE, gdm on
    # GNOME, lightdm on Cinnamon and XFCE. The displaymanager module only
    # configures the display manager - the session, the greeter, autologin -
    # and never enables its unit, which is this module's job, so listing only
    # sddm here left a GNOME or XFCE install with no display-manager.service
    # and a text login on first boot. Enabling a unit that is not installed is
    # skipped because none of them is mandatory.
    # wdm (WINGs Display Manager) comes first when the edition installs it:
    # Big WindowMaker keeps LightDM only for the live session's autologin and
    # logs into the installed system with wdm. The first enabled unit takes
    # the display-manager.service alias and the later ones are skipped (none
    # is mandatory), so editions without wdm are not affected.
    - name: wdm
      action: enable
      mandatory: false
    - name: sddm
      action: enable
      mandatory: false
    - name: gdm
      action: enable
      mandatory: false
    - name: lightdm
      action: enable
      mandatory: false
    - name: graphical.target
      action: set-default
      mandatory: false
    - name: pacman-init
      action: mask
      mandatory: false
