---
units:
    - name: bluetooth
      action: enable
      mandatory: false
    - name: cronie
      action: enable
      mandatory: false
    - name: ModemManager
      action: enable
      mandatory: false
    - name: NetworkManager
      action: enable
      mandatory: false
    - name: cups
      action: enable
      mandatory: false
    - name: fstrim.timer
      action: enable
      mandatory: false
    - name: vboxservice
      action: enable
      mandatory: false
    - name: ufw
      action: enable
      mandatory: false
    - name: nmb
      action: enable
      mandatory: false
    - name: smb
      action: enable
      mandatory: false
    # dnsmasq is not enabled: with the stock config it listened on every
    # interface and answered DNS for any host on the network (an open
    # forwarder), while the system itself resolves through NetworkManager's
    # resolv.conf. NetworkManager starts its own dnsmasq for shared
    # connections, which needs only the package.
    # The live session turns NTP on at runtime (timedatectl set-ntp), but the
    # installed system only gets the units listed here: without this entry a
    # BIOS clock set to local time stayed 3 h behind (NTP service: inactive).
    - name: systemd-timesyncd
      action: enable
      mandatory: false
    # iso-profiles enable_systemd only reaches the live image. Without these
    # the installed system booted Intel Gen4 (G45/Q45) on modesetting+glamor
    # (GPU HANG in Xorg) and never set the GRUB resolution on first boot.
    - name: big-wm-intel-gen4
      action: enable
      mandatory: false
    - name: big-wm-grub-resolucao
      action: enable
      mandatory: false
    # The display manager: Big WindowMaker logs in with wdm (WINGs Display
    # Manager), in the live session too. The displaymanager module only
    # configures it and never enables its unit, which is this module's job.
    # Other editions' managers (sddm, gdm, lightdm) are not listed: they are
    # not installed (enabling them only logged errors), or lightdm, still
    # installed, failed against the display-manager.service alias of wdm.
    - name: wdm
      action: enable
      mandatory: false
    - name: graphical.target
      action: set-default
      mandatory: false
    - name: pacman-init
      action: mask
      mandatory: false
