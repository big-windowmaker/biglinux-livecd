---

dontChroot: false

script:
    - "pacman-key --init"
    # Offline, nothing corrects a clock that is behind (a flat CMOS battery,
    # a machine kept off): gpg then sees the newest keys as created in the
    # future, skips them and --populate fails, aborting the installation.
    # The keyrings are never older than their keys, so a clock behind them
    # is wrong for sure: move it forward to them (hwclock saves it later).
    # A clock that is right, or ahead, is left alone.
    - command: >-
        newest=$(stat -c %Y /usr/share/pacman/keyrings/*.gpg | sort -n | tail -n 1);
        if [ -n "$newest" ] && [ "$(date +%s)" -lt "$newest" ]; then
        date -u -s "@$newest";
        fi
      timeout: 30
    - command: "pacman-key --populate archlinux manjaro biglinux"
      timeout: 1200

i18n:
    name: "Init pacman-key"
