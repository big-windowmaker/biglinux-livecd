---

dontChroot: false

script:
    - "pacman-key --init"
    # big-wm: a chave do repositório [big-wm] (big-wm-keyring, sempre na ISO
    # do Big WindowMaker; o pacman.conf da edição exige a assinatura).
    - command: "pacman-key --populate archlinux manjaro biglinux big-wm"
      timeout: 1200

i18n:
    name: "Init pacman-key"
