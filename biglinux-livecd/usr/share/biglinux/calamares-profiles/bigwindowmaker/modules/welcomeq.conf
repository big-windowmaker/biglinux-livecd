# BigLinux welcomeq configuration.
# SPDX-License-Identifier: CC0-1.0
---
# Load the BigLinux QML shipped by this branding component.
qmlSearch: branding
qmlFilename: welcomeq

showSupportUrl: false
showKnownIssuesUrl: false
showReleaseNotesUrl: false
showDonateUrl: false

requirements:
    internetCheckUrl: https://google.com
    requiredStorage: 4
    requiredRam: 0.5
    check:
        - storage
        - ram
        - power
        - internet
        - root
    required:
        - storage
        - ram
        - root

# No geoip here: the live wizard already set the language (LANG reaches
# Calamares), and the country of the network would replace that choice
# (English chosen in Brazil came up as "português (Brasil)"). The time zone
# keeps its own lookup in locale.conf.
